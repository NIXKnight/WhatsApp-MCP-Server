[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-mcp"
version = "1.0.0"
description = "FastMCP server bridging Claude Code to a Go WhatsApp bridge via REST"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
]

[project.scripts]
whatsapp-mcp = "whatsapp_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_mcp"]
