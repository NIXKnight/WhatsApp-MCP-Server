[project]
name = "whatsapp-transcriber"
version = "0.1.0"
description = "L3 enrichment worker: transcribes WhatsApp voice notes via Whisper into messages_media; also exposes an on-demand /analyze HTTP endpoint that extracts video keyframes + audio transcript with ffmpeg"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]

[project.scripts]
whatsapp-transcriber = "whatsapp_transcriber.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_transcriber"]
