services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bridge:
    build: ./bridge
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      BRIDGE_ADDR: "0.0.0.0:8080"
      BRIDGE_DATA_DIR: "/data"
      DATABASE_URL: "postgres://whatsapp:whatsapp@postgres:5432/whatsapp?sslmode=disable"
    volumes:
      - bridge-data:/data
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build: ./mcp-server
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      BRIDGE_URL: "http://bridge:8080"
      MCP_TRANSPORT: "sse"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3000"
      WORKSPACE_DIR: "/workspace"
      WORKSPACE_HOST_PATH: "${WORKSPACE_PATH:-./workspace}"
      UV_CACHE_DIR: "/tmp/uv-cache"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      bridge:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  bridge-data:
