services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bridge:
    build: ./bridge
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      BRIDGE_ADDR: "0.0.0.0:8080"
      BRIDGE_DATA_DIR: "/data"
      DATABASE_URL: "postgres://whatsapp:whatsapp@postgres:5432/whatsapp?sslmode=disable"
    volumes:
      - bridge-data:/data
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build: ./mcp-server
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      BRIDGE_URL: "http://bridge:8080"
      MCP_TRANSPORT: "sse"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3000"
      WORKSPACE_DIR: "/workspace"
      WORKSPACE_HOST_PATH: "${WORKSPACE_PATH:-./workspace}"
      UV_CACHE_DIR: "/tmp/uv-cache"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      bridge:
        condition: service_healthy
    restart: unless-stopped

  embedder:
    build: ./embedder
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: "postgres://whatsapp:whatsapp@postgres:5432/whatsapp?sslmode=disable"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}"
      EMBED_BATCH_SIZE: "${EMBED_BATCH_SIZE:-100}"
      EMBED_POLL_INTERVAL: "${EMBED_POLL_INTERVAL:-30}"
      HF_HOME: "/home/bridge/.cache/huggingface"
    volumes:
      - embedder-cache:/home/bridge/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

  transcriber:
    build: ./transcriber
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: "postgres://whatsapp:whatsapp@postgres:5432/whatsapp?sslmode=disable"
      BRIDGE_URL: "http://bridge:8080"
      # Whisper runs as an external HOST process; reach it via the host gateway.
      WHISPER_URL: "${WHISPER_URL:-http://host.docker.internal:8443}"
      WHISPER_MODEL: "${WHISPER_MODEL:-large-v3}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-ur}"
      TRANSCRIBE_BATCH_SIZE: "${TRANSCRIBE_BATCH_SIZE:-20}"
      TRANSCRIBE_POLL_INTERVAL: "${TRANSCRIBE_POLL_INTERVAL:-30}"
      # Re-downloaded media must land in the shared bridge data volume so both
      # the bridge (writer) and this worker (reader) see the same path.
      REDOWNLOAD_DIR: "/data"
    volumes:
      - bridge-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: "postgres://whatsapp:whatsapp@postgres:5432/whatsapp?sslmode=disable"
      BRIDGE_URL: "http://bridge:8080"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "9090"
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  bridge-data:
  embedder-cache:
