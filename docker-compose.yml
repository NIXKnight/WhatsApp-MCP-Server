services:
  bridge:
    build: ./bridge
    environment:
      BRIDGE_ADDR: "0.0.0.0:8080"
      BRIDGE_DATA_DIR: "/data"
    volumes:
      - bridge-data:/data
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    stop_grace_period: 20s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build: ./mcp-server
    ports:
      - "3000:3000"
    environment:
      BRIDGE_URL: "http://bridge:8080"
      MCP_TRANSPORT: "sse"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3000"
      WORKSPACE_DIR: "/workspace"
      WORKSPACE_HOST_PATH: "${WORKSPACE_PATH:-./workspace}"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      bridge:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bridge-data:
